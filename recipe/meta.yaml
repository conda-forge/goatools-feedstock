{% set name = "goatools" %}
{% set version = "1.6.8" %}
{% set sha256 = "3a318a440ff973d93c94bb6f530a8f342ed07d76e54b579578f44d983fcd9e40" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/g/goatools/goatools-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  noarch: python
  script_env:
    - SETUPTOOLS_SCM_PRETEND_VERSION={{ version }}
  entry_points:
    - goatools = goatools.cli.main:main
    - find_enrichment.py = goatools.cli.find_enrichment:main
    - go_plot.py = goatools.cli.gosubdag_plot:main
    - map_to_slim.py = goatools.cli.map_to_slim:main
    - wr_hier.py = goatools.cli.wr_hierarchy:main
    - plot_go_term.py = goatools.cli.plot_go_term:main
    - ncbi_gene_results_to_python.py = goatools.cli.ncbi_gene_results_to_python:main
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
    - setuptools-scm >=8
  run:
    - python >={{ python_min }}
    - setuptools
    - ftpretty
    - numpy
    - openpyxl
    - pandas
    - pydot
    - requests
    - rich
    - scipy
    - statsmodels
    - xlsxwriter

test:
  requires:
    - python {{ python_min }}
  imports:
    - goatools
    - goatools.obo_parser
    - goatools.go_enrichment
    - goatools.associations
  commands:
    - find_enrichment.py -h
    - map_to_slim.py -h
    - plot_go_term.py -h

about:
  home: "https://github.com/tanghaibao/goatools"
  summary: "Python library to handle and find enriched Gene Ontology (GO) terms."
  license: "BSD-2-Clause"
  license_family: BSD
  license_file: LICENSE
  doc_url: "https://github.com/tanghaibao/goatools/blob/v{{ version }}/README.md"
  dev_url: "https://github.com/tanghaibao/goatools"

extra:
  recipe-maintainers:
    - mencian
